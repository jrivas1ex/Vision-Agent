name: Build VisionAgent.exe

# Se ejecuta automaticamente al subir cambios a main, y tambien se puede
# lanzar a mano desde la pestana "Actions" de GitHub (Run workflow).
on:
  push:
    branches: [ main ]
  workflow_dispatch: {}

jobs:
  build-windows-exe:
    runs-on: windows-latest
    steps:
      - name: Descargar el codigo
        uses: actions/checkout@v4

      - name: Instalar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: |
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Compilar VisionAgent.exe
        run: pyinstaller vision_agent.spec

      - name: Publicar el .exe como artefacto descargable
        uses: actions/upload-artifact@v4
        with:
          name: VisionAgent-windows
          path: dist/VisionAgent/
